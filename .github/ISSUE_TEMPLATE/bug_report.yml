name: Relatar problema
description: Informe uma falha sem publicar dados pessoais ou credenciais.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Antes de enviar, remova tokens, nomes de usuário, números de série, IPs e caminhos pessoais."
  - type: input
    id: app-version
    attributes:
      label: Versão do RGB Central
    validations:
      required: true
  - type: input
    id: vendor-software
    attributes:
      label: Fabricante e versão do software oficial
      placeholder: "Ex.: iCUE 5.x"
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Comportamento observado
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidade
      options:
        - label: Revisei o conteúdo e removi credenciais e dados pessoais.
          required: true
